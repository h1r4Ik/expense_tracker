name: expense_tracker
description: "Personal expense tracker with offline-first sync and family groups."
publish_to: 'none'
version: 2.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0

  # State management
  provider: ^6.1.5+1

  # Navigation
  go_router: ^15.1.2

  # UI
  google_fonts: ^8.2.1
  lucide_icons_flutter: ^4.0.0

  # Local storage
  shared_preferences: ^2.2.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.0.0
  collection: ^1.18.0
  http: ^1.2.1
  connectivity_plus: ^6.1.4

  # PDF & export
  pdf: ^3.13.1
  printing: ^5.15.1
  path_provider: ^2.1.6

  # Update service
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/logo-removebg-preview.png
